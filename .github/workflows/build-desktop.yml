name: Build Desktop App

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: "dist/*.exe"
          - os: macos-latest
            artifact: "dist/*.dmg"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Write .env
        working-directory: desktop
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npm run dist:win

      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: npm run dist:mac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: photolive-${{ runner.os }}
          path: desktop/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Rename artifact for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp desktop/dist/*Setup*.exe desktop/dist/PhotoLive-Setup.exe
          else
            cp desktop/dist/*.dmg desktop/dist/PhotoLive.dmg
          fi

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/PhotoLive-Setup.exe
            desktop/dist/PhotoLive.dmg
          fail_on_unmatched_files: false
